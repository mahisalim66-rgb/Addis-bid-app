name: Build Addis Bid Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradle
      run: chmod +x gradlew || true

    - name: Build Debug APK & Play Store Bundle (AAB) with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug bundleDebug --no-daemon
        else
          gradle assembleDebug bundleDebug --no-daemon
        fi

    - name: Upload APK & Play Store AAB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AddisBid-Android-Builds
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/bundle/debug/*.aab
